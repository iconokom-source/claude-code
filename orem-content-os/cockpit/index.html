<title>Orem Content Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Trykker&family=Lexend+Deca:wght@300;400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout : charte Orem. Fond noir, cartes sombres arrondies avec label et index en coin (comme le guide de marque),
   titres Trykker, texte Lexend Deca, halo bleu Orem en tête, orange réservé aux signaux d'action. */
:root{
  --bg:#000000; --surface:#0D0D0D; --card:#171717; --card-2:#1F1F1F; --line:#262626; --line-2:#333333;
  --ink:#F2F2F2; --muted:rgba(242,242,242,.6); --faint:#777777;
  --blue:#092482; --blue-deep:#051026; --sky:#C5E6F1; --orange:#FF6200; --peach:#FCDFCE; --umber:#210E03;
  --tof:#C5E6F1; --mof:#6E86FF; --bof:#FF6200;
  --good:#6FD39B; --good-soft:rgba(111,211,155,.12); --warn:#FFB066; --warn-soft:rgba(255,98,0,.14); --bad:#FF7A6B; --bad-soft:rgba(255,122,107,.12);
  --blue-soft:rgba(110,134,255,.14);
  --glow:radial-gradient(120% 90% at 20% -10%, rgba(9,36,130,.55) 0%, rgba(5,16,38,.35) 40%, rgba(0,0,0,0) 70%);
  --f-display:"Trykker",Georgia,"Times New Roman",serif;
  --f-body:"Lexend Deca","Avenir Next","Segoe UI",system-ui,sans-serif;
  --r:18px; --r-sm:12px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F2F2F2; --surface:#EAEAEA; --card:#FFFFFF; --card-2:#F7F7F7; --line:#DEDEDE; --line-2:#CFCFCF;
  --ink:#000000; --muted:rgba(0,0,0,.6); --faint:#777777;
  --tof:#2C7A93; --mof:#092482; --bof:#D95300;
  --good:#1D7A4B; --good-soft:rgba(29,122,75,.1); --warn:#B34700; --warn-soft:rgba(255,98,0,.12); --bad:#B42318; --bad-soft:rgba(180,35,24,.08);
  --blue-soft:rgba(9,36,130,.08);
  --glow:radial-gradient(120% 90% at 20% -10%, rgba(197,230,241,.9) 0%, rgba(197,230,241,.35) 40%, rgba(242,242,242,0) 70%);
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F2F2F2; --surface:#EAEAEA; --card:#FFFFFF; --card-2:#F7F7F7; --line:#DEDEDE; --line-2:#CFCFCF;
  --ink:#000000; --muted:rgba(0,0,0,.6); --faint:#777777;
  --tof:#2C7A93; --mof:#092482; --bof:#D95300;
  --good:#1D7A4B; --good-soft:rgba(29,122,75,.1); --warn:#B34700; --warn-soft:rgba(255,98,0,.12); --bad:#B42318; --bad-soft:rgba(180,35,24,.08);
  --blue-soft:rgba(9,36,130,.08);
  --glow:radial-gradient(120% 90% at 20% -10%, rgba(197,230,241,.9) 0%, rgba(197,230,241,.35) 40%, rgba(242,242,242,0) 70%);
  color-scheme:light}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:300 15px/1.55 var(--f-body);margin:0;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:-.005em;text-wrap:balance;margin:0}
h1{font-size:clamp(1.9rem,3.2vw,2.6rem);line-height:1.08;letter-spacing:-.035em}
h2{font-size:1.35rem;line-height:1.2;letter-spacing:-.02em}
h3{font-size:1.02rem;line-height:1.3}
b,strong{font-weight:500}
.num{font-variant-numeric:tabular-nums}
.label{font:400 .74rem/1 var(--f-body);color:var(--muted)}
.muted{color:var(--muted)}
a{color:inherit;text-decoration-color:var(--faint);text-underline-offset:3px}
a:hover{text-decoration-color:var(--orange)}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;padding:22px 14px;display:flex;flex-direction:column;gap:28px}
.brand{display:flex;align-items:center;gap:10px;padding-inline:10px}
.mark{width:30px;height:30px;background:var(--ink);-webkit-mask:var(--mark) center/contain no-repeat;mask:var(--mark) center/contain no-repeat;flex:none}
.brand-txt{display:flex;flex-direction:column;gap:3px}
.brand-txt b{font:600 1.2rem/1 var(--f-body);letter-spacing:-.03em}
.brand-txt span{font-size:.72rem;color:var(--muted)}
nav{display:flex;flex-direction:column;gap:2px}
.nav-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:10px 12px;border:0;border-radius:999px;background:transparent;text-align:left;cursor:pointer;color:var(--muted);font-weight:400;font-size:.92rem}
.nav-btn:hover{color:var(--ink);background:var(--card)}
.nav-btn[aria-current="page"]{background:var(--card);color:var(--ink)}
.nav-btn[aria-current="page"]::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--orange);margin-right:-2px;order:-1}
.nav-btn span:first-of-type{flex:1}
.count{font:500 .7rem/1 var(--f-body);padding:4px 7px;border-radius:99px;background:var(--card-2);color:var(--muted);font-variant-numeric:tabular-nums}
.nav-btn[aria-current="page"] .count{background:var(--ink);color:var(--bg)}
.rail-foot{margin-top:auto;font-size:.76rem;color:var(--faint);padding-inline:12px;display:flex;flex-direction:column;gap:7px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--faint);margin-right:7px;vertical-align:middle}
.dot.on{background:var(--good)}

main{padding-block:28px 72px;padding-inline:32px;min-width:0;width:100%;position:relative}
main::before{content:"";position:absolute;inset:0 0 auto 0;height:420px;background:var(--glow);pointer-events:none;z-index:0}
main > *{position:relative;z-index:1}
.wrap{max-width:1180px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px;padding-top:14px}
.head-txt{display:flex;flex-direction:column;gap:12px;min-width:0}
.head p{margin:0;color:var(--muted);max-width:60ch}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:1px solid var(--line-2);background:transparent;cursor:pointer;font-weight:400;font-size:.88rem;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.primary:hover{opacity:.88}
.btn.primary .arr{display:inline-block;transition:transform .2s}
.btn.primary:hover .arr{transform:translate(2px,-2px)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn:disabled{opacity:.5;cursor:progress}
.btn.sm{padding:6px 12px;font-size:.8rem}

/* Carte façon guide de marque : label en haut à gauche, index en haut à droite */
.panel{background:var(--card);border-radius:var(--r);padding:18px 20px 22px;min-width:0;display:flex;flex-direction:column;gap:14px}
.panel-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.74rem;color:var(--muted)}
.panel-top .idx{font-variant-numeric:tabular-nums}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:var(--r);padding:16px 18px 18px;display:flex;flex-direction:column;gap:18px}
.kpi b{font:400 2.6rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi span{font-size:.76rem;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:.74rem;font-weight:400;background:var(--card-2);color:var(--muted);white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.acc{background:var(--blue-soft);color:var(--mof)}

/* Board */
.board{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 2px;font-size:.8rem;color:var(--muted)}
.card{background:var(--card);border:1px solid transparent;border-radius:var(--r-sm);padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--line-2)}
.card h3{font-family:var(--f-body);font-weight:400;font-size:.95rem;line-height:1.4}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.72rem;color:var(--muted)}
.funnel{display:inline-flex;align-items:center;gap:6px}
.funnel i{width:7px;height:7px;border-radius:50%;background:var(--pc,var(--faint))}
.card-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.76rem;color:var(--muted)}
.score{font:500 .76rem/1 var(--f-body);padding:5px 8px;border-radius:99px;background:var(--card-2);font-variant-numeric:tabular-nums}
.score.hi{background:var(--good-soft);color:var(--good)}
.score.mid{background:var(--warn-soft);color:var(--warn)}
.empty-col{font-size:.8rem;color:var(--faint);padding:10px 6px}

/* Lists */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;padding:14px 2px;border-top:1px solid var(--line);align-items:start}
.item:first-child{border-top:0;padding-top:4px}
.item p{margin:4px 0 0;color:var(--muted);font-size:.86rem}
.quote{font-family:var(--f-display);font-size:1.02rem;line-height:1.45;margin:8px 0 0;color:var(--ink)}
.tag{font:400 .7rem/1 var(--f-body);padding:6px 9px;border-radius:99px;background:var(--card-2);color:var(--muted);min-width:84px;text-align:center;white-space:nowrap}
.tag.client{background:var(--blue-soft);color:var(--mof)}
.tag.marche{background:var(--good-soft);color:var(--good)}
.tag.preuve,.tag.alerte{background:var(--warn-soft);color:var(--warn)}

.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:7px 13px;border-radius:99px;border:1px solid var(--line-2);background:transparent;font-size:.8rem;cursor:pointer;color:var(--muted)}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Balance */
.bal{display:flex;flex-direction:column;gap:16px}
.bal-row{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 80px;gap:14px;align-items:center;font-size:.84rem}
.track{position:relative;height:8px;border-radius:99px;background:var(--card-2)}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--pc)}
.target{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);border-radius:2px}
.bal-num{text-align:right;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* Table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{font:400 .72rem/1 var(--f-body);color:var(--muted);text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n{text-align:right;font-variant-numeric:tabular-nums}
th.n{text-align:right}

/* Forms */
label{display:flex;flex-direction:column;gap:7px;font-size:.78rem;font-weight:400;color:var(--muted)}
input[type=text],input[type=url],input[type=date],input[type=number],select,textarea{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);font-size:.9rem;font-weight:300}
input:focus,select:focus,textarea:focus{border-color:var(--line-2);outline:none;box-shadow:0 0 0 3px var(--blue-soft)}
textarea{resize:vertical;min-height:120px;line-height:1.6}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}

/* Mémoire */
.mem{display:grid;grid-template-columns:230px minmax(0,1fr);gap:14px}
.mem-nav{display:flex;flex-direction:column;gap:4px}
.mem-nav button{text-align:left;padding:11px 14px;border-radius:var(--r-sm);border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;gap:4px;color:var(--muted)}
.mem-nav button:hover{color:var(--ink)}
.mem-nav button[aria-current="true"]{background:var(--card);color:var(--ink)}
.mem-nav small{color:var(--faint);font-size:.72rem}
.mem textarea{min-height:460px;font-size:.86rem}
.meter{height:3px;border-radius:99px;background:var(--card-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--sky)}
.pil-card{background:var(--surface);border-radius:var(--r-sm);padding:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(660px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:21;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-h{padding:22px 24px 18px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;background:var(--glow)}
.drawer-b{padding:4px 24px 48px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px 14px;font-size:.88rem}
.kv dt{color:var(--muted);font-size:.78rem;padding-top:2px}
.kv dd{margin:0}
.tension{font-family:var(--f-display);font-size:1.2rem;line-height:1.45}
.step{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0;padding-top:2px}
.step-n{font:500 .78rem/1 var(--f-body);width:26px;height:26px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.step ul{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:.88rem}
.step li::marker{color:var(--orange)}
.proof{display:flex;gap:12px;align-items:flex-start;font-size:.86rem;padding:6px 0}
.scorebars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sb{background:var(--surface);border-radius:var(--r-sm);padding:12px;display:flex;flex-direction:column;gap:8px}
.sb b{font:400 1.5rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.sb span{font-size:.72rem;color:var(--muted)}

/* Jury ICP, hooks, notes de signaux, questions */
.jury{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.jury-note{font:400 2.2rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.jury-note small{font:400 .8rem var(--f-body);color:var(--muted)}
.jury-voice{font-family:var(--f-display);font-size:1.05rem;line-height:1.5;margin:0}
.verdict{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;padding:4px 10px;border-radius:99px}
.verdict.lit{background:var(--good-soft);color:var(--good)}
.verdict.scroll{background:var(--bad-soft);color:var(--bad)}
.icp-badge{font:500 .72rem/1 var(--f-body);padding:5px 8px;border-radius:99px;background:var(--blue-soft);color:var(--mof);font-variant-numeric:tabular-nums}
.hook{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.hook:first-child{border-top:0;padding-top:2px}
.hook p{margin:0;font-size:.95rem;line-height:1.5;white-space:pre-line}
.hook .meta{font-size:.74rem;color:var(--muted);margin-top:6px}
.hook.best p{color:var(--ink)}
.hook.best .meta b{color:var(--orange);font-weight:500}
.sig-note{font:500 .78rem/1 var(--f-body);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);font-variant-numeric:tabular-nums;flex:none}
.sig-note.hi{border-color:var(--orange);color:var(--orange)}
.sig-left{display:flex;flex-direction:column;align-items:center;gap:8px}
.reads{margin:8px 0 0;font-size:.86rem;color:var(--ink);padding-left:12px;border-left:2px solid var(--orange)}
.qa{display:flex;flex-direction:column;gap:14px}
.qa label span{color:var(--ink);font-size:.9rem;font-weight:400}
.qa small{color:var(--faint);font-size:.74rem}
.jet-steps{display:flex;flex-direction:column;gap:8px;padding:6px 0}
.jet-step{display:flex;align-items:center;gap:10px;font-size:.86rem;color:var(--faint)}
.jet-step.done{color:var(--muted)}
.jet-step.now{color:var(--ink)}
.jet-step.done .step-n{border-color:var(--good);color:var(--good)}
.jet-step.now .step-n{border-color:var(--orange);color:var(--orange)}
.jet-text{white-space:pre-line;background:var(--surface);border-radius:var(--r-sm);padding:16px 18px;font-size:.93rem;line-height:1.6}
.iv-log{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow-y:auto;padding:4px 0}
.iv-msg{padding:10px 14px;border-radius:14px;font-size:.9rem;max-width:85%;white-space:pre-line}
.iv-msg.agent{background:var(--surface);align-self:flex-start}
.iv-msg.louis{background:var(--blue-soft);align-self:flex-end}
.idea-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:.88rem}
.idea-row:first-child{border-top:0}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:.86rem;z-index:40;max-width:calc(100% - 32px)}
.banner{padding:13px 16px;border-radius:var(--r-sm);background:var(--warn-soft);color:var(--warn);font-size:.86rem;margin-bottom:14px}
.empty{padding:22px;border:1px dashed var(--line-2);border-radius:var(--r-sm);color:var(--muted);display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.empty b{color:var(--ink)}
.spin{display:inline-block;width:12px;height:12px;border:1.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.btn.primary .arr{transition:none}}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;padding:10px 16px;gap:14px;background:var(--bg);border-bottom:1px solid var(--line);z-index:10;overflow-x:auto}
  .brand-txt span,.rail-foot{display:none}
  nav{flex-direction:row}
  .nav-btn{white-space:nowrap}
  main{padding-inline:16px;padding-block:18px 56px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid-2,.mem,.form-grid,.pil-card{grid-template-columns:minmax(0,1fr)}
  .mem-nav{flex-direction:row;overflow-x:auto}
  .mem-nav button{white-space:nowrap}
  .bal-row{grid-template-columns:minmax(0,96px) minmax(0,1fr) 64px}
  .kv{grid-template-columns:minmax(0,1fr)}
  .scorebars{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>

<script>
(() => {
const VIEWS = [
  {id:'semaine', label:'Cette semaine'},
  {id:'briefs', label:'Briefs'},
  {id:'signaux', label:'Signaux'},
  {id:'posts', label:'Posts publiés'},
  {id:'atelier', label:'Atelier'},
  {id:'memoire', label:'Mémoire Orem'},
];
const STATUTS = [
  {id:'nouveau', label:'À arbitrer'},
  {id:'retenu', label:'Retenus'},
  {id:'planifie', label:'Planifiés'},
  {id:'publie', label:'Publiés'},
];
const MEMOIRE = [
  {id:'plan', titre:'Plan LinkedIn', aide:'Je veux être connu pour quoi ? Qui je veux attirer ? Mon territoire de parole.'},
  {id:'positionnement', titre:'Positionnement', aide:'Catégorie, promesse, méthode O.R.E.M., maison de message.'},
  {id:'icp', titre:'Cibles (ICP)', aide:'Moment de bascule, personas, douleurs, déclencheurs, objections.'},
  {id:'offres', titre:'Offres', aide:'Conseil, Image de marque, Site web, Suivis. Ce que chaque offre rapporte.'},
  {id:'convictions', titre:'Convictions', aide:'Tes opinions tranchées. La matière première des angles.'},
  {id:'clients', titre:'Clients et preuves', aide:'Cas, résultats, chiffres publiables oui / anonymisé / non.'},
  {id:'anti_sujets', titre:'Anti-sujets', aide:'Mots bannis, angles grillés, clichés, profils exclus.'},
  {id:'calibrage', titre:'Ce qui performe', aide:'Calibrage tiré de tes posts et du marché : accroches, structures, clôtures et longueurs qui marchent. Mis à jour par l\'agent de mesure.'},
];
const CLIENT_TYPES = ['verbatim','objection','douleur','crainte','declencheur','question'];
const SIGNAL_TYPES = [...CLIENT_TYPES,'veille','webflow','preuve'];
const CONSCIENCE = ['Inconscient','Conscient du problème','Conscient de la solution','Conscient de l\'offre','Très conscient'];
const FUNNEL_VAR = {TOF:'--tof', MOF:'--mof', BOF:'--bof'};

const S = {view:'semaine', briefs:[], signaux:[], posts:[], piliers:[], sources:[], runs:[], idees:[], cas:[], faits:[], anecdotes:[], regles:[], jet:{}, terrain:'metier', memoire:{},
  dbOk:null, sampleOk:null, open:null, sigFilter:'tous', briefPilier:'tous', memTab:'plan', busy:{}};
const JURY_MIN = 6;
const sigVisible = s => !s.archive;
try{ const v = (location.hash||'').slice(1); if (VIEWS.some(x=>x.id===v)) S.view=v; }catch(e){}
try{ const v = localStorage.getItem('orem.view'); if (!location.hash && v && VIEWS.some(x=>x.id===v)) S.view=v; }catch(e){}

let db = null, sample = null, pendingRender = false;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ts = v => typeof v === 'number' ? v : (v ? (Date.parse(v) || 0) : 0);
const fmtDate = v => { const t = ts(v); return t ? new Date(t).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}) : ''; };
const nf = n => (n==null||n==='') ? '' : Number(n).toLocaleString('fr-FR');
const pad = n => String(n).padStart(2,'0');
function isoWeek(d=new Date()){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day); const y=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y)/864e5+1)/7); }
const DAY = 864e5;
const scoreTotal = b => { const s=b.score||{}; return ['icp','originalite','preuve','timing'].reduce((a,k)=>a+(+s[k]||0),0); };
const codeOf = name => { const p = S.piliers.find(x => x.nom === name || x.code === name); return p ? p.code : (String(name||'').match(/\b(TOF|MOF|BOF)\b/)||[])[1] || ''; };
const pilierColor = name => { const c = codeOf(name); return c ? `var(${FUNNEL_VAR[c]})` : 'var(--faint)'; };
const pilierLabel = name => { const p = S.piliers.find(x => x.nom === name || x.code === codeOf(name)); return p ? p.nom : (name || 'Sans pilier'); };
const sigFamily = t => CLIENT_TYPES.includes(t) ? 'client' : ['veille','webflow'].includes(t) ? 'marche' : 'preuve';

function toast(msg){ const r=$('#toastRoot'); r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t=setTimeout(()=>r.innerHTML='',3200); }
function setView(v){ S.view=v; try{localStorage.setItem('orem.view',v)}catch(e){} render(true); window.scrollTo(0,0); }
const panelTop = (label, idx) => `<div class="panel-top"><span>${esc(label)}</span><span class="idx">${pad(idx)}</span></div>`;

/* ---------- Données ---------- */
async function boot(){
  render();
  try { db = await claude.use('db'); } catch(e){ db = null; }
  S.dbOk = !!db;
  try { sample = await claude.use('sample'); } catch(e){ sample = null; }
  S.sampleOk = !!sample;
  if (!db){ render(); return; }
  ['briefs','signaux','posts','piliers','sources','runs','memoire','idees','cas','faits','anecdotes','regles'].forEach(name => {
    db.collection(name).limit(1000).onSnapshot(snap => {
      const rows = snap.docs.map(d => ({id:d.id, ...d.data()}));
      if (name === 'memoire') S.memoire = Object.fromEntries(rows.map(r => [r.id, r]));
      else S[name] = rows;
      if (name === 'piliers') S.piliers.sort((a,b)=>(a.ordre??99)-(b.ordre??99));
      render();
    }, err => toast('Lecture impossible : ' + (err && err.message || 'erreur')));
  });
}
async function write(fn, okMsg){
  if (!db){ toast('Base indisponible dans cette vue.'); return false; }
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch(e){ toast(e && e.code === 'not_granted' ? 'Tu n\'as pas les droits d\'écriture sur cet outil.' : 'Échec de l\'enregistrement : ' + (e && e.message || 'erreur')); return false; }
}
const upd = (col,id,data,msg) => write(() => db.collection(col).doc(id).update({...data, maj: Date.now()}), msg);

/* ---------- Claude (atelier) ---------- */
const HUMAN = `Écriture humaine obligatoire (tout ce que tu écris doit sonner comme les notes d'un dirigeant qui connaît son sujet) :
- Jamais de tiret cadratin, jamais d'emoji, pas de gras décoratif.
- Pas de triade systématique (trois adjectifs, trois bénéfices). Un ou deux mots précis.
- Pas de « ce n'est pas X, c'est Y » ni « non seulement... mais aussi » en réflexe.
- Bannis : plonger dans, au cœur de, à l'ère de, s'inscrire dans, tirer parti de, naviguer, favoriser, écosystème, paysage, robuste, riche, dédié, clé (adjectif), incontournable, véritable, il est important de noter, par ailleurs, en outre, de plus, en conclusion, vraiment, extrêmement, tout simplement, n'hésitez pas.
- Pas de participe présent analytique en fin de phrase (« ..., renforçant sa position »).
- Pas de fausse amplitude « de X à Y », pas d'attribution vague (« certains experts »).
- Verbes concrets. Mots de terrain, ceux qu'un prospect emploie en call. Longueurs de phrases variées, fragments autorisés.`;
const RULES = `Tu es le content manager interne d'Orem (anciennement ICONOKOM), studio de clarté stratégique, d'image et d'exécution pilotée pour PME B2B. Tu travailles pour Louis Montagne, cofondateur, dont le territoire de parole est « le système et la visibilité » (Webflow, automatisation, IA, SEO, GEO, site vivant).
Tu NE RÉDIGES JAMAIS de post. Tu produis uniquement des briefs structurés que Louis rédigera lui-même.
Règles absolues :
- Aucune phrase rédigée prête à publier, aucune accroche écrite. Décris la tension à exploiter, pas la formulation.
- Chaque point de structure : une idée clé en 12 mots maximum, style télégraphique.
- Chaque brief s'appuie sur au moins une preuve réelle fournie dans le contexte (signal, verbatim, chiffre, post). N'invente jamais de chiffre ni de citation.
- Un brief = un pilier (TOF, MOF ou BOF), un thème, un persona, un niveau de conscience, une idée.
- TOF Visibilité : valeurs, sujets larges pour la cible. MOF Autorité : problèmes de la cible et la manière Orem de les résoudre. BOF Conversion : cas clients, preuves, résultats.
- Évite les angles déjà traités listés dans l'historique, ou propose explicitement un angle différent.
- Respecte les anti-sujets et les mots bannis.
- Français. N'utilise jamais le caractère tiret cadratin.
${HUMAN}`;
function schema(){
  const pil = S.piliers.map(p => `${p.code} (thèmes : ${(p.themes||[]).filter(Boolean).join(', ') || 'libres'})`).join(' ; ');
  return `Piliers disponibles : ${pil || 'TOF, MOF, BOF'}.
Réponds UNIQUEMENT en JSON : {"briefs":[{"titre":"sujet en 8 mots max","pilier":"TOF|MOF|BOF","theme":"un thème du pilier","persona":"","conscience":"${CONSCIENCE.join('|')}","tension":"décalage entre ce que la cible croit et la réalité, 25 mots max","conviction":"conviction Orem mobilisée","structure":[{"etape":"Constat","points":["..."]},{"etape":"Retournement","points":["..."]},{"etape":"Démonstration","points":["...","...","..."]},{"etape":"Preuve","points":["..."]},{"etape":"Ouverture","points":["intention de CTA"]}],"preuves":[{"type":"verbatim|chiffre|cas|veille|post","ref":"source exacte tirée du contexte"}],"format":"texte|carrousel|vidéo|sondage","offre":"Conseil|Image de marque|Site web|Suivi","pourquoi_maintenant":"","score":{"icp":0,"originalite":0,"preuve":0,"timing":0}}]}. Chaque score sur 5, sois exigeant.`;
}
function context({signals=[], posts=[]}={}){
  const cut = (s,n) => { s = String(s||''); return s.length>n ? s.slice(0,n)+' […]' : s; };
  const mem = MEMOIRE.map(m => `## ${m.titre}\n${cut(S.memoire[m.id]?.contenu,3200) || '(vide)'}`).join('\n\n');
  const pil = S.piliers.map(p => `- ${p.code} ${p.nom} : ${p.objectif||''} (cible ${p.cible_pct||0}%). Thèmes : ${(p.themes||[]).filter(Boolean).join(', ')||'à définir'}`).join('\n') || '(aucun pilier défini)';
  const hist = S.briefs.slice().sort((a,b)=>ts(b.cree)-ts(a.cree)).slice(0,40).map(b => `- [${b.statut}] ${b.titre} (${codeOf(b.pilier)}${b.theme?' / '+b.theme:''})${b.statut==='rejete'&&b.feedback?' rejeté : '+b.feedback:''}`).join('\n');
  const sig = signals.map(s => `- (${s.type}${s.persona?' / '+s.persona:''}) ${s.titre||''} :: ${cut(s.citation||s.resume,400)} [source: ${s.source||''} ${s.url||''}]`).join('\n');
  const po = posts.map(p => `- ${fmtDate(p.date)} ${codeOf(p.pilier)} | ${nf(p.impressions)} impr, ${nf(p.engagements)} eng., ${nf(p.leads)} leads | ${cut(p.texte||p.sujet||p.url,600)}`).join('\n');
  const cas = S.cas.map(c => `- ${c.nom} (${c.secteur}) : ${c.probleme} Résultat : ${c.resultat}. Chiffres : ${(c.chiffres||[]).slice(0,5).join(' ; ')}. Leviers : ${c.leviers||''}. À ne pas dire : ${c.eviter||''}`).join('\n');
  return `# MÉMOIRE OREM\n${mem}\n\n# CAS CLIENTS RÉELS (seules preuves chiffrées autorisées)\n${cas||'(aucun)'}\n\n# PILIERS\n${pil}\n\n# HISTORIQUE DES BRIEFS (à ne pas dupliquer)\n${hist||'(aucun)'}${sig?`\n\n# SIGNAUX FOURNIS\n${sig}`:''}${po?`\n\n# POSTS FOURNIS\n${po}`:''}`;
}
async function askBriefs(key, task, ctx, extra={}){
  if (!sample){ toast('Claude n\'est pas disponible dans cette vue.'); return false; }
  if (S.busy[key]) return false;
  S.busy[key] = true; render(true);
  try{
    const out = await sample.json(`${RULES}\n\n${context(ctx)}\n\n# MISSION\n${task}\n\n${schema()}`, {modelTier:'complex', cache:false});

const TICS_MOTS = ['plonger dans','au cœur de','à l\'ère de','s\'inscrit dans','s\'inscrire dans','tirer parti','naviguer','favoriser','écosystème','paysage','robuste','incontournable','véritable','il est important de','il convient de','par ailleurs','en outre','de plus,','en conclusion','dans l\'ensemble','force est de constater','vraiment','extrêmement','tout simplement','véritablement','n\'hésitez pas','game-changer','game changer','clé en main','pas cher','template','vitrine','joli','tendance','solutions digitales','au cœur','transformation digitale','accompagner dans'];
const TICS_MOTIFS = [
  [/\u2014|\u2013/, 'tiret cadratin ou demi-cadratin'],
  [/ce n['’]est pas [^.\n]{1,70}[,.]\s*c['’]est /i, '« ce n\'est pas X, c\'est Y »'],

  [/le truc que personne|personne ne (te|vous) (le )?dit|ce que personne ne/i, '« ce que personne ne dit »'],
  [/^et si /im, 'accroche « Et si… »'],
  [/voici pourquoi|voilà pourquoi/i, '« voici pourquoi »'],
  [/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/u, 'emoji'],
];
function lintTexte(texte, sourcesTexte){
  const out = [], low = texte.toLowerCase();
  TICS_MOTS.forEach(m => { if (low.includes(m)) out.push({type:'mot', detail:`mot à bannir : « ${m} »`}); });
  TICS_MOTIFS.forEach(([re,l]) => { if (re.test(texte)) out.push({type:'motif', detail:l}); });
  const lignes = texte.split('\n').map(x=>x.trim()).filter(Boolean);
  for (let i=0;i+2<lignes.length;i++){ const w=l=>l.split(/\s+/)[0].toLowerCase(); if (w(lignes[i]).length>2 && w(lignes[i])===w(lignes[i+1]) && w(lignes[i])===w(lignes[i+2])){ out.push({type:'motif', detail:`anaphore en trois temps (« ${lignes[i].split(/\s+/)[0]}… ») : effet triade`}); break; } }
  const src = String(sourcesTexte||'').replace(/[\s  .]/g,'');
  const nums = texte.match(/\d[\d\s  .,]*\d|\d+/g) || [];
  [...new Set(nums)].forEach(n => { const k = n.replace(/[\s  .]/g,''); if ((+k.replace(',','.')>12 || /%|€/.test(texte.slice(texte.indexOf(n), texte.indexOf(n)+n.length+2))) && !src.includes(k)) out.push({type:'chiffre', detail:`chiffre introuvable dans les sources : ${n.trim()}`}); });
  const max = {Court:700, Moyen:1300, Long:2600}[voix().longueur] || 1300;
  if (texte.length > max) out.push({type:'longueur', detail:`${texte.length} caractères, au-delà de la cible (${max})`});
  return out;
}

# CATALOGUE DES SOURCES (id :: contenu)\n${cat.map(x=>`${x.id} [${x.type}] ${x.label.slice(0,380)}`).join('\n').slice(0,14000)}
Réponds UNIQUEMENT en JSON : {"angle":"l'angle en une phrase","scene":"la scène ou le fait d'ouverture choisi","sources":["id"],"manque":"ce qui manque pour que ce post soit impossible à écrire par quelqu'un d'autre, ou vide"}`, {modelTier:'default', cache:false});
    const choisies = cat.filter(x => (plan.sources||[]).includes(x.id));
    const srcTxt = choisies.map(x=>`[${x.type}] ${x.label}`).join('\n');
    setJet(b.id, {etape:3, plan});
    const r1 = await sample(`Tu écris le premier jet d'un post LinkedIn pour Louis Montagne. Il le réécrira lui-même, mais le texte doit déjà sonner comme lui.
# SA VOIX\n${voixPrompt()}
# CONTEXTE\n${mem}
# CE QUI PERFORME (applique ces règles, tes réglages de voix restent prioritaires)\n${calib}
# BRIEF\n${JSON.stringify(brief)}
# ANGLE RETENU\n${plan.angle||''}\nOuverture : ${plan.scene||''}
# SOURCES AUTORISÉES (seuls faits et chiffres utilisables)\n${srcTxt}
${HUMAN}
Contraintes dures :
- Chaque fait, chaque chiffre vient des sources ci-dessus. Aucun chiffre, aucun client, aucune citation inventés. Si un détail manque, écris autour, n'invente pas.
- Pas de nom de client si la source dit de l'anonymiser ou si c'est un verbatim de prospect.
- Pas de maxime creuse à la fin de chaque paragraphe. Pas de titre, pas de hashtags.
Rends UNIQUEMENT le texte du post.`, {modelTier:'complex', cache:false});
    let texte = String(r1.text||'').trim();
    setJet(b.id, {etape:4, texte});
    const r2 = await sample.json(`Tu retravailles uniquement la première ligne (accroche) et la dernière ligne (chute) de ce post LinkedIn. Le reste ne bouge pas.
L'accroche doit arrêter un dirigeant de PME B2B qui scrolle : concrète, spécifique à ce post, sans formule usée (« Et si… », « Voici pourquoi », « Personne ne vous dit », « Arrêtez de… »). ${voix().accroches.length?'Types autorisés : '+voix().accroches.join(', ')+'.':''}
La chute : ${VX.clotures[voix().cloture]||''} Pas de morale générique.
# CE QUI PERFORME (données réelles, appuie tes choix dessus)\n${calib}
${HUMAN}
# POST\n${texte}
Réponds UNIQUEMENT en JSON : {"accroche":"nouvelle première ligne","chute":"nouvelle dernière ligne","pourquoi":"en une phrase"}`, {modelTier:'default', cache:false});
    if (r2 && r2.accroche && r2.chute){ const L = texte.split('\n'); const fi = L.findIndex(x=>x.trim()); let li = L.length-1; while (li>0 && !L[li].trim()) li--; if (fi>=0){ L[fi]=r2.accroche; if (li>fi) L[li]=r2.chute; texte = L.join('\n'); } }
    setJet(b.id, {etape:5, texte});
    const lint1 = lintTexte(texte, srcTxt + '\n' + mem);
    const r3 = await sample.json(`Tu es le relecteur le plus exigeant de Louis. Ta mission : que ce post ne puisse être écrit par personne d'autre et qu'aucune trace d'IA ne subsiste.
1. Repère chaque tic d'écriture IA : triades, contrastes en réflexe, maximes plaquées, formules que n'importe quel auteur LinkedIn pourrait écrire, transitions vides, rythme trop régulier.
2. Repère chaque phrase générique qui pourrait figurer sur le compte d'un autre consultant.
3. Réécris ces passages seulement, en gardant la voix, les faits et la structure. Ne rajoute aucun fait.
# SA VOIX\n${voixPrompt()}
# SOURCES AUTORISÉES\n${srcTxt}
# PROBLÈMES DÉJÀ DÉTECTÉS AUTOMATIQUEMENT (à corriger en priorité)\n${lint1.map(x=>'- '+x.detail).join('\n')||'aucun'}
${HUMAN}
# POST\n${texte}
Réponds UNIQUEMENT en JSON : {"problemes":[{"extrait":"","raison":""}],"signature":"ce qui rend ce post impossible à écrire par un autre, ou ce qui manque encore","texte":"le post corrigé complet"}`, {modelTier:'complex', cache:false});
    if (r3 && r3.texte) texte = String(r3.texte).trim();
    setJet(b.id, {etape:6, texte});
    const lint2 = lintTexte(texte, srcTxt + '\n' + mem);
    const prev = b.jet?.texte ? [...(b.jet.versions||[]), b.jet.texte].slice(-4) : (b.jet?.versions||[]);
    const jet = {texte, versions:prev, angle:plan.angle||'', manque:plan.manque||'', sources:choisies.map(x=>({id:x.id, type:x.type, label:x.label.slice(0,220)})), accroche_pourquoi:r2?.pourquoi||'', problemes:(r3?.problemes||[]).slice(0,10), signature:r3?.signature||'', restant:lint2, date:Date.now()};
    await upd('briefs', b.id, {jet}, lint2.length ? `Premier jet prêt, ${lint2.length} point${lint2.length>1?'s':''} à vérifier` : 'Premier jet prêt, contrôle propre');
  } catch(e){ toast(e?.code==='rate_limited'?'Trop de demandes, réessaie dans une minute.':'Rédaction interrompue : '+(e?.message||'erreur')); }
  finally{ S.jet[b.id] = {}; renderDrawer(); }
}

const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>3);
const similaire = (a,b) => { const A=new Set(norm(a)), B=new Set(norm(b)); if(!A.size||!B.size) return 0; let n=0; A.forEach(w=>{ if(B.has(w)) n++; }); return n/Math.min(A.size,B.size); };
async function apprendre(b, finale){
  if (!sample || !b.jet?.texte) return;
  S.busy['learn:'+b.id] = true; renderDrawer();
  try{
    const r = await sample.json(`Louis a réécrit le premier jet d'un post. Compare les deux versions et déduis ses préférences d'écriture durables.
Ne retiens que ce qui se généralise à d'autres posts (rythme, ouverture, vocabulaire, ce qu'il coupe, ce qu'il ajoute), pas les corrections propres à ce sujet. 0 à 3 règles, chacune en une phrase à l'impératif, concrète.
Règles déjà connues (ne les répète pas) :\n${S.regles.map(x=>'- '+x.texte).join('\n')||'aucune'}
# PREMIER JET\n${b.jet.texte}\n# VERSION DE LOUIS\n${finale}
Réponds UNIQUEMENT en JSON : {"regles":["..."]}`, {modelTier:'default', cache:false});
    const neuves = (r?.regles||[]).map(x=>String(x).replace(/\u2014/g,',').slice(0,240)).filter(x => x && !S.regles.some(e => similaire(e.texte,x) > .6));
    await write(async()=>{
      await db.collection('briefs').doc(b.id).update({version_finale:finale, maj:Date.now()});
      for (const t of neuves) await db.collection('regles').add({texte:t, origine:'correction', brief:b.titre, date:Date.now()});
    }, neuves.length ? `${neuves.length} règle${neuves.length>1?'s':''} apprise${neuves.length>1?'s':''} de ta réécriture` : 'Version enregistrée, aucune nouvelle règle');
  } catch(e){ toast('Apprentissage interrompu : '+(e?.message||'erreur')); }
  finally{ S.busy['learn:'+b.id]=false; renderDrawer(); }
}

/* Interview : une scène à la fois, de plus en plus précise. */
const INTERVIEW_PRINCIPES = `Tu interviewes Louis pour récolter la matière de ses futurs posts. Tes questions suivent ces principes :
- Tu demandes un moment qui a eu lieu, jamais un sujet général. Une question à laquelle il peut répondre par une généralité est ratée.
- Tu t'appuies sur ce que tu sais déjà de lui et tu le cites : ta question doit être impossible à poser à quelqu'un d'autre.
- Tu vises ce qui ne s'invente pas : mots exacts entendus, chiffres, mois, prénoms, ce qu'il a ressenti, ce qu'il a fait juste après.
- Une seule scène par question, mais tu peux demander jusqu'à trois détails de cette scène.
- Tu vas là où il y a de la tension : ce qui a basculé, ce qu'on lui a déconseillé, ce qu'il a arrêté, ce qu'il refuse.
- Chaque question part de sa réponse précédente et creuse, elle ne repart pas de zéro.
- Tu réagis brièvement et naturellement à sa réponse avant la question suivante, comme dans une vraie conversation.
Tutoiement, français parlé, jamais de tiret cadratin.`;
function terrainCouverture(){ return TERRAINS.map(t => ({...t, n:S.anecdotes.filter(a => a.terrain===t.id || (!a.terrain && t.themes.includes(a.theme))).length})); }
async function interviewTour(reponse){
  if (!sample){ toast('Claude n\'est pas disponible dans cette vue.'); return; }
  const iv = S.memoire.interview || {};
  const t = TERRAINS.find(x=>x.id===(iv.terrain||S.terrain)) || TERRAINS[0];
  const echanges = [...(iv.echanges||[])]; if (reponse) echanges.push({role:'louis', texte:reponse.slice(0,3000)});
  S.busy.iv = true; render(true);
  try{
    const deja = S.anecdotes.filter(a => t.themes.includes(a.theme)).map(a=>`- ${a.sujet} : ${a.recit}`).join('\n');
    const faits = S.faits.slice(0,40).map(f=>'- '+f.texte).join('\n');
    const out = await sample.json(`${INTERVIEW_PRINCIPES}
# TERRAIN : ${t.nom}\nÀ rapporter : ${t.cible}\nPistes possibles : ${t.pistes.join(' ; ')}
# CE QU'ON SAIT DÉJÀ DE LUI\n${faits}\n# ANECDOTES DÉJÀ RÉCOLTÉES SUR CE TERRAIN\n${deja||'aucune'}
# CONVERSATION EN COURS\n${echanges.map(e=>(e.role==='louis'?'Louis : ':'Toi : ')+e.texte).join('\n')||'(début)'}
${reponse?`Si sa dernière réponse contient une scène exploitable (un moment réel avec au moins un détail concret), extrais-la en anecdote fidèle à ses mots, sans rien ajouter. Sinon anecdote = null.`:'Pose la première question.'}
Réponds UNIQUEMENT en JSON : {"anecdote":${reponse?'{"sujet":"la question à laquelle elle répond","recit":"le récit fidèle, 2 à 5 phrases","theme":"un parmi '+THEMES.join(', ')+'"} ou null':'null'},"question":"ta réaction courte puis ta prochaine question"}`, {modelTier:'default', cache:false});
    if (out?.anecdote?.recit) await write(()=>db.collection('anecdotes').add({sujet:String(out.anecdote.sujet||'').slice(0,200), recit:String(out.anecdote.recit).slice(0,1500), theme:THEMES.includes(out.anecdote.theme)?out.anecdote.theme:t.themes[0], terrain:t.id, source:'interview', date:Date.now()}), 'Anecdote ajoutée à ta banque');
    if (out?.question) echanges.push({role:'agent', texte:String(out.question).replace(/\u2014/g,',').slice(0,800)});
    await write(()=>db.collection('memoire').doc('interview').set({titre:'Interview', terrain:t.id, echanges:echanges.slice(-16), maj:Date.now()}));
  } catch(e){ toast('Interview interrompue : '+(e?.message||'erreur')); }
  finally{ S.busy.iv=false; render(true); }
}

function sanitizeBrief(b){
  const clip = (v,n=300) => String(v ?? '').slice(0,n);
  const sc = b.score || {};
  const code = (String(b.pilier||'').match(/TOF|MOF|BOF/)||[])[0] || '';
  const p = S.piliers.find(x => x.code === code);
  return {
    titre: clip(b.titre,140), pilier: p ? p.nom : clip(b.pilier,80), theme: clip(b.theme,80), persona: clip(b.persona,160), conscience: clip(b.conscience,60),
    tension: clip(b.tension,400), conviction: clip(b.conviction,300), format: clip(b.format,40), offre: clip(b.offre,120),
    pourquoi_maintenant: clip(b.pourquoi_maintenant,300),
    structure: (Array.isArray(b.structure)?b.structure:[]).slice(0,7).map(s => ({etape:clip(s.etape,40), points:(Array.isArray(s.points)?s.points:[]).slice(0,6).map(x=>clip(x,160))})),
    preuves: (Array.isArray(b.preuves)?b.preuves:[]).slice(0,5).map(x => ({type:clip(x.type,20), ref:clip(x.ref,300)})),
    score: {icp:+sc.icp||0, originalite:+sc.originalite||0, preuve:+sc.preuve||0, timing:+sc.timing||0},
  };
}

function render(force){

  pendingRender = false;
  renderNav();
  const v = {semaine:vSemaine, briefs:vBriefs, signaux:vSignaux, posts:vPosts, atelier:vAtelier, memoire:vMemoire}[S.view];
  $('#main').innerHTML = `<div class="wrap">${S.dbOk === false ? `<div class="banner">La base de l'outil n'est pas accessible dans cette vue. Ouvre la page depuis claude.ai pour voir et modifier les données.</div>` : ''}${v()}</div>`;

}
document.addEventListener('focusout', () => setTimeout(() => { if (pendingRender) render(); }, 0));

function balance(){
  if (!S.piliers.length) return `<div class="empty"><b>Aucun pilier défini.</b><span>Configure TOF, MOF et BOF dans Mémoire Orem.</span></div>`;
  const since = Date.now()-60*DAY;

function laggingPilier(){
  const since = Date.now()-60*DAY;
  const items = [...S.posts.filter(p=>ts(p.date)>since).map(p=>codeOf(p.pilier)), ...S.briefs.filter(b=>b.statut==='planifie').map(b=>codeOf(b.pilier))];
  const total = items.length || 1;
  let worst=null, gap=-1;
  S.piliers.forEach(p => { const g = (+p.cible_pct||0) - items.filter(x=>x===p.code).length/total*100; if (g>gap){gap=g;worst=p.code;} });
  return worst;
}

/* ---------- Événements ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('button, a[data-view], .scrim');
  if (!t) return;
  const d = t.dataset;
  if (d.view){ e.preventDefault(); setView(d.view); return; }
  if (d.openBrief){ S.open = d.openBrief; renderDrawer(); return; }
  if ('close' in d){ S.open = null; renderDrawer(); return; }
  if (d.briefPilier){ S.briefPilier = d.briefPilier; render(true); return; }
  if (d.sigFilter){ S.sigFilter = d.sigFilter; render(true); return; }
  if (d.memTab){ S.memTab = d.memTab; S.vxDraft = null; render(true); return; }
  if ('addSignal' in d){ const p=$('#addSignal'); p.hidden=!p.hidden; return; }
  if ('addPost' in d){ const p=$('#addPost'); p.hidden=!p.hidden; return; }
  const b = S.briefs.find(x=>x.id===S.open);
  if (d.setStatut && b){ await upd('briefs', b.id, {statut:d.setStatut}, 'Brief mis à jour'); return; }
  if ('reject' in d && b){ await upd('briefs', b.id, {statut:'rejete', feedback: ($('#rejReason')?.value||'').trim().slice(0,300)}, 'Brief rejeté, raison enregistrée'); S.open=null; renderDrawer(); return; }
  if ('plan' in d && b){ const v=$('#planDate')?.value; if(!v){toast('Choisis une date.');return;} await upd('briefs', b.id, {statut:'planifie', date_prevue:v}, 'Brief planifié'); return; }
  if ('publish' in d && b){
    const url = ($('#pubUrl')?.value||'').trim();
    const ok = await upd('briefs', b.id, {statut:'publie', lien_post:url, publie_le:new Date().toISOString().slice(0,10)}, 'Publié. Pense à importer les stats à J+7.');
    if (ok && url){ const id = postId(url); await write(()=>db.collection('posts').doc(id).set({url, sujet:b.titre, pilier:b.pilier||'', theme:b.theme||'', brief_id:b.id, date:new Date().toISOString().slice(0,10), maj:Date.now()})); }
    return;
  }
  if (d.alt){ const br = S.briefs.find(x=>x.id===d.alt); if(!br) return;
    await askBriefs('alt:'+br.id, `Propose 3 variantes de ce brief, chacune avec un changement net : 1) autre persona, 2) autre preuve, 3) autre pilier du funnel ou autre format. Brief de départ : ${JSON.stringify(br)}`, {signals:[]}, {parent:br.id}); return; }
  if (d.sigBrief){ const s = S.signaux.find(x=>x.id===d.sigBrief); if(!s) return;
    const ok = await askBriefs('sig:'+s.id, `Construis 3 briefs aux angles nettement différents à partir de ce signal, idéalement un TOF, un MOF et un BOF. Le signal est la preuve principale.`, {signals:[s]}, {signal_id:s.id});
    if (ok) await upd('signaux', s.id, {utilise:true}); return; }
  if (d.recycle){ const p = S.posts.find(x=>x.id===d.recycle); if(!p) return;
    const top = S.posts.slice().sort((a,b)=>(b.engagements||0)-(a.engagements||0)).slice(0,5);
    await askBriefs('post:'+p.id, `Ce post a été publié. Propose 3 briefs qui le recyclent sous un angle neuf (autre persona, autre preuve, point de vue inverse ou approfondissement). Pour calibrer, les 5 posts les plus engageants sont fournis.`, {posts:[p, ...top.filter(x=>x.id!==p.id)]}, {recycle_de:p.id}); return; }
  if (d.atelier === 'idee'){ const v = ($('#aIdee')?.value||'').trim(); if(!v){toast('Écris ton idée d\'abord.');return;} await askQuestions(v); return; }
  if (d.jury){ const br = S.briefs.find(x=>x.id===d.jury); if (br) await juryOne(br); return; }
  if (d.hooks){ const br = S.briefs.find(x=>x.id===d.hooks); if (br) await genHooks(br); return; }
  if (d.copy != null){ try{ await navigator.clipboard.writeText(d.copy); toast('Hook copié'); }catch(err){ toast('Copie impossible ici, sélectionne le texte.'); } return; }
  if ('interp' in d){ await interpretSignals(S.signaux.filter(s=>s.note==null && !s.archive).slice(0,40)); return; }
  if (d.archiveSig){ const s=S.signaux.find(x=>x.id===d.archiveSig); if(s) await upd('signaux', s.id, {archive:!s.archive}, s.archive?'Signal restauré':'Signal archivé'); return; }
  if (d.jet){ const br = S.briefs.find(x=>x.id===d.jet); if (br) await premierJet(br); return; }
  if (d.learn){ const br = S.briefs.find(x=>x.id===d.learn); const v = ($('#finale-'+d.learn)?.value||'').trim(); if(!br) return; if(!v){ toast('Colle ta version réécrite d\'abord.'); return; } await apprendre(br, v); return; }
  if (d.vx){ const v = S.vxDraft = S.vxDraft || JSON.parse(JSON.stringify(voix())); const val = d.val;
    if (d.multi==='1'){ const arr = v[d.vx] = [...(v[d.vx]||[])]; const i = arr.indexOf(val); if (i>=0) arr.splice(i,1); else if (d.vx!=='registres' || arr.length<3) arr.push(val); }
    else v[d.vx] = (v[d.vx]===val && ['structure'].includes(d.vx)) ? '' : val;
    render(true); return; }
  if ('saveVoix' in d){ const v = S.vxDraft || JSON.parse(JSON.stringify(voix()));
    document.querySelectorAll('[data-vx-lines]').forEach(el => { v[el.dataset.vxLines] = el.value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,40); });
    const ok = await write(()=>db.collection('memoire').doc('voix').set({titre:'Voix', config:v, maj:Date.now()}), 'Voix enregistrée'); if (ok) S.vxDraft = null; render(true); return; }
  if (d.terrain){ S.terrain = d.terrain; const iv = S.memoire.interview; if (iv && iv.terrain!==d.terrain) await write(()=>db.collection('memoire').doc('interview').set({titre:'Interview', terrain:d.terrain, echanges:[], maj:Date.now()})); else render(true); return; }
  if (d.iv==='start'){ await interviewTour(''); return; }
  if (d.iv==='repondre'){ const v = ($('#ivRep')?.value||'').trim(); if(!v){ toast('Écris ta réponse d\'abord.'); return; } await interviewTour(v); return; }
  if (d.iv==='reset'){ await write(()=>db.collection('memoire').doc('interview').set({titre:'Interview', terrain:S.memoire.interview?.terrain||S.terrain, echanges:[], maj:Date.now()})); return; }
  if (d.delAnec){ await write(()=>db.collection('anecdotes').doc(d.delAnec).delete(), 'Anecdote supprimée'); return; }
  if (d.delRegle){ await write(()=>db.collection('regles').doc(d.delRegle).delete(), 'Règle retirée'); return; }
  if (d.openIdea != null){ S.openIdea = d.openIdea || null; render(true); return; }
  if (d.ideaPilier){ S.ideaPilier = d.ideaPilier; S.openIdea = null; render(true); return; }
  if (d.saveIdea){ const f=document.querySelector(`form[data-idea="${d.saveIdea}"]`); const i=S.idees.find(x=>x.id===d.saveIdea); if(f&&i) await upd('idees', i.id, {reponses:(i.questions||[]).map((_,k)=>(f.elements['r'+k]?.value||'').trim())}, 'Réponses enregistrées'); return; }
  if (d.delIdea){ await write(()=>db.collection('idees').doc(d.delIdea).delete(), 'Idée abandonnée'); return; }
  if (d.atelier === 'semaine'){
    const sig = S.signaux.filter(s=>!s.utilise && ts(s.date||s.cree)>Date.now()-21*DAY).slice(0,40);
    const top = S.posts.slice().sort((a,b)=>(b.engagements||0)-(a.engagements||0)).slice(0,5);
    await askBriefs('semaine', `Prépare la semaine : 5 briefs couvrant TOF, MOF et BOF, en priorisant le pilier en retard « ${laggingPilier()||''} ». Classe-les du meilleur score au plus faible.`, {signals:sig, posts:top}); return; }
  if (d.atelier === 'objection'){ const s = S.signaux.find(x=>x.id===$('#aObj')?.value); if(!s){toast('Choisis une objection.');return;}
    await askBriefs('objection', `Construis 3 briefs qui traitent cette objection en amont, pour qu'un prospect arrive au rendez-vous déjà rassuré. Angles différents : démonstration (MOF), cas client (BOF), conviction (TOF).`, {signals:[s]}, {signal_id:s.id}); return; }
  if (d.atelier === 'us'){ const sig = S.signaux.filter(s=>s.emergent_us).slice(0,20); if(!sig.length){toast('Aucun signal Émergent US pour l\'instant.');return;}
    await askBriefs('us', `Ces tendances montent aux États-Unis et sont peu traitées en France. Construis 3 briefs first-mover pour le marché français, en rendant la tendance concrète pour les PME B2B cibles d'Orem.`, {signals:sig}); return; }
  if (d.saveMem){ const v = $('#memText')?.value ?? ''; const m = MEMOIRE.find(x=>x.id===d.saveMem);
    await write(()=>db.collection('memoire').doc(d.saveMem).set({titre:m.titre, contenu:v, maj:Date.now()}), 'Mémoire enregistrée'); render(true); return; }
  if (d.toggleSrc){ const s=S.sources.find(x=>x.id===d.toggleSrc); if(s) await upd('sources', s.id, {actif: s.actif===false}); return; }
});

  if (f.dataset.pilForm){

    const themes = [0,1,2].map(i => f.elements['t'+i].value.trim().slice(0,80));
    await upd('piliers', f.dataset.pilForm, {cible_pct:pct, themes}, 'Pilier enregistré'); render(true); return;

  if (f.id === 'fAnec'){
    const sujet = $('#anSujet').value.trim(), recit = $('#anRecit').value.trim(); if(!sujet||!recit) return;

  }
  if (f.id === 'fSignal'){
    const titre = $('#sTitre').value.trim(); if(!titre) return;

    let ref = null;
    const ok = await write(async()=>{ ref = await db.collection('signaux').add(data); }, 'Signal enregistré, évaluation en cours');
    if (ok){ f.reset(); $('#addSignal').hidden = true; if (ref && sample) await interpretSignals([{id:ref.id, ...data}]); }
  }
  if (f.id === 'fPost'){
    const url = $('#pUrl').value.trim(); const id = url ? postId(url) : 'm'+Date.now();
    const ok = await write(()=>db.collection('posts').doc(id).set({url, sujet:$('#pSujet').value.trim(), date:$('#pDate').value||new Date().toISOString().slice(0,10), pilier:$('#pPilier').value, impressions:+$('#pImp').value||0, engagements:+$('#pEng').value||0, leads:+$('#pLeads').value||0, maj:Date.now()}), 'Post enregistré');
    if (ok){ f.reset(); $('#addPost').hidden = true; }
  }
  if (f.id === 'fSrc'){
    const nom = $('#srNom').value.trim(); if(!nom) return;
    await write(()=>db.collection('sources').add({nom, url:$('#srUrl').value.trim(), zone:$('#srZone').value, type:$('#srType').value, actif:true}), 'Source ajoutée'); f.reset();
  }
});

/* ---------- Import LinkedIn ---------- */
function postId(url){ const m = String(url).match(/(?:activity|share|ugcPost)[-:](\d{10,})/); return m ? 'li'+m[1] : 'u'+Math.abs([...String(url)].reduce((h,c)=>((h<<5)-h+c.charCodeAt(0))|0,0)); }
function toISO(v){
  if (v instanceof Date) return v.toISOString().slice(0,10);
  if (typeof v === 'number' && v > 20000 && v < 80000) return new Date(Date.UTC(1899,11,30)+v*DAY).toISOString().slice(0,10);
  const s = String(v||'').trim(); const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return `${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
  const t = Date.parse(s); return t ? new Date(t).toISOString().slice(0,10) : '';
}
async function importLinkedIn(file){
  if (typeof XLSX === 'undefined'){ toast('Lecteur Excel indisponible, recharge la page.'); return; }
  try{
    const wb = XLSX.read(await file.arrayBuffer(), {type:'array', cellDates:true});
    const found = {};
    wb.SheetNames.forEach(name => {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:''});
      let header = null;
      rows.forEach(r => {
        const cells = r.map(c => String(c).toLowerCase());
        if (cells.some(c => c.includes('post url') || c.includes('url de la publication') || c.includes('url du post'))){ header = cells; return; }
        if (!header) return;
        r.forEach((c,i) => {
          if (typeof c === 'string' && /linkedin\.com\//.test(c)){
            const id = postId(c); const o = found[id] ||= {url:c.trim()};
            const date = toISO(r[i+1]); if (date) o.date = date;
            const metric = header[i+2] || '';
            const val = +String(r[i+2]).replace(/[^\d.]/g,'') || 0;
            if (/impression/.test(metric)) o.impressions = val;
            else if (/engag|interaction/.test(metric)) o.engagements = val;
          }
        });
      });
    });
    const ids = Object.keys(found);
    if (!ids.length){ toast('Aucun post trouvé. Utilise l\'export Contenu des statistiques LinkedIn.'); return; }
    await write(async () => {
      for (const id of ids){
        const ref = db.collection('posts').doc(id); const snap = await ref.get();
        const data = {...found[id], maj:Date.now(), source:'export LinkedIn'};
        if (snap.exists) await ref.update(data); else await ref.set({sujet:'', pilier:'', leads:0, ...data});
      }
    }, `${ids.length} post${ids.length>1?'s':''} importé${ids.length>1?'s':''} ou mis à jour`);
  } catch(e){ toast('Fichier illisible : ' + (e && e.message || 'format inconnu')); }
}

boot();
