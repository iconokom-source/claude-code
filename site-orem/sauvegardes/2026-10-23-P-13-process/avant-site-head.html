<style>
  /* ===== Showreel mobile (<=767px) : carrousel vertical mot/image =====
     Structure ajoutee par l'utilisateur dans le Designer (container-mobile-change > div-change
     [5x secondary-text + ligne-orange.haut] + container.24px-gap [change-div.gauche / .droite]).
     .div-change et .ligne-orange.haut n'avaient aucune regle CSS - base posee ici, uniquement
     sous 767px pour ne jamais affecter le desktop (qui garde son mecanisme IX2 natif existant,
     inchange). La largeur/hauteur de .div-change n'est PLUS forcee ici (elle est laissee au
     Designer, qui a ses propres regles par breakpoint) - seuls position/overflow, necessaires au
     fonctionnement du carrousel, sont poses. */

    .div-change {
      position: relative;
      overflow: hidden;
    }
    /* !important necessaire : certains mots ont ete edites individuellement dans le Designer par
       l'utilisateur (voir historique), ce qui peut creer des regles a specificite egale ou
       superieure a cette regle generique. Sans !important, le centrage flex ne gagnait le
       conflit de cascade que pour le mot affiche au chargement initial, pas pour les autres. */
    .div-change .secondary-text {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      text-align: center !important;
    }
    .ligne-orange.haut {
      position: absolute;
      left: 0;
      bottom: -8px;
      height: 3px;
      width: 0%;
      background-color: #ff6200;
    }
    /* "Showreel 2025" en attente (comme sur desktop, cf. .container-showreal.hide) : exclu de la
       rotation JS ci-dessous, et masque au cas ou le JS n'ait pas encore tourne. */

      display: none !important;
    }
    .change-div {
      cursor: pointer;
    }
    /* Le wrapper ambiant autour des images (.container._0px-vertical.center._32px-radius.fond-blanc)
       est pilote par la meme interaction IX2 native que le mecanisme desktop, qui lui applique un
       opacity via inline style en continu (fige a une valeur partielle sur mobile car son trigger
       ne peut jamais aboutir a ce breakpoint). Un simple style.opacity='1' en JS ne suffit pas car
       IX2 le reecrase. Une regle CSS !important gagne toujours face a un inline style non-important. */

<script>
  (function () {
    // ===== Showreel mobile (<=767px uniquement) : carrousel vertical mot/image =====
    // Le mecanisme desktop (.container-showreal x5 + .ligne-orange) est pilote par une
    // interaction IX2 native Webflow (verifie en direct : aucun JS custom ne le controlait deja)
    // et reste totalement inchange - son conteneur (.container._1x5-grid.change-hide) est deja
    // masque par le Designer sous 767px. Ce bloc construit la version mobile equivalente sur la
    // structure ajoutee par l'utilisateur (container-mobile-change), independante du desktop.
    // Les classes mot -> classes image ne correspondent PAS 1:1 (ex: mot "web" / image
    // "conception-web", mot "suivi" / image "accompagnement") - table de correspondance explicite
    // ci-dessous plutot que de supposer une egalite de nom.
    // FIX (2026-09-07) : les images .image.absolute-showreel etaient invisibles sur mobile car
    // leur conteneur ambiant (.container._0px-vertical.center._32px-radius.fond-blanc, le parent
    // direct de .container.image-showreel) a opacity:0 par defaut dans le Designer - visiblement
    // prevu pour etre revele par l'interaction IX2 desktop, qui ne se declenche jamais sur mobile
    // (son conteneur declencheur est masque a ce breakpoint). Force ici a opacity:1 sur mobile
    // uniquement, sans toucher au desktop.
    // FIX (2026-09-08) : la barre de progression (.ligne-orange) restait bloquee a 100% apres le
    // premier cycle car startProgress() n'etait redemarree que sur un clic manuel (via
    // restartAutoplay), jamais lors d'un defilement automatique. next(false) redemarre desormais
    // aussi la barre de progression.
    // FIX (2026-09-08 bis) : le centrage vertical ne fonctionnait que pour le premier mot affiche.
    // Cause 1 (CSS) : conflit de cascade avec des regles posees individuellement sur certains mots
    // dans le Designer - resolu avec !important. Cause 2 (JS) : measure() lisait offsetHeight alors
    // que le CSS impose height:100% sur le mot, donc au lieu de mesurer la hauteur naturelle du
    // texte elle relisait la hauteur deja fixee du parent (mesure circulaire, jamais correcte hors
    // du tout premier appel). measure() neutralise desormais height:100% via un style inline
    // temporaire pour lire la vraie hauteur de contenu avant de la restaurer.
    function initShowreelMobile() {
      if (window.innerWidth > 767) return;
      var wrap = document.querySelector('.container-mobile-change');
      if (!wrap) return;
      var divChange = wrap.querySelector('.div-change');
      if (!divChange) return;
      // "Showreel 2025" est exclu de la rotation, comme sur desktop ou l'element equivalent
      // (.container-showreal[data-showreel="showreel-2025"]) porte une classe "hide" - le showreel
      // n'est pas encore pret, donc ni son mot ni son image ne doivent apparaitre pour le moment.
      var words = Array.prototype.slice.call(divChange.querySelectorAll('.secondary-text')).filter(function (w) {
        return !w.classList.contains('showreel');
      });
      var ligne = divChange.querySelector('.ligne-orange');
      var prevBtn = wrap.querySelector('.change-div.gauche');
      var nextBtn = wrap.querySelector('.change-div.droite');
      if (!words.length) return;

      var imageShowreel = document.querySelector('.container.image-showreel');
      if (imageShowreel && imageShowreel.parentElement) {
        imageShowreel.parentElement.style.opacity = '1';
      }

      var KEY_MAP = {
        showreel: 'showreel-2025',
        web: 'conception-web',
        da: 'direction-artistique',
        suivi: 'accompagnement',
        copywriting: 'copywriting',
      };
      var BASE_CLASSES = { 'secondary-text': true, _18px: true };
      function localKeyOf(el) {
        return Array.prototype.filter.call(el.classList, function (c) {
          return !BASE_CLASSES[c];
        })[0];
      }

      var images = Array.prototype.slice.call(document.querySelectorAll('.image.absolute-showreel'));
      function setImage(localKey) {
        var target = KEY_MAP[localKey];
        if (!target) return;
        images.forEach(function (img) {
          img.style.opacity = img.classList.contains(target) ? '1' : '0';
        });
      }

      var DURATION = 500; // ms
      var AUTOPLAY_MS = 4000;
      var current = 0;
      var isAnimating = false;
      var timer = null;
      var progressRAF = null;

      words.forEach(function (w) {
        w.style.position = 'absolute';
        w.style.top = '0';
        w.style.left = '0';
        w.style.width = '100%';
        w.style.transition = 'transform ' + DURATION + 'ms ease, opacity ' + DURATION + 'ms ease';
      });

      // Hauteur reelle d'un mot (peut wrapper sur 2 lignes selon la largeur d'ecran) : mesuree
      // hors flux d'animation, sans toucher son etat courant de facon visible. Le CSS impose
      // height:100% (pour le centrage vertical flex) - on le neutralise temporairement via un
      // style inline (height:auto) pendant la mesure pour lire la vraie hauteur du contenu, sinon
      // offsetHeight ne renvoie que la hauteur deja fixee du parent (mesure circulaire).
      function measure(el) {
        var prevTransform = el.style.transform;
        var prevTransition = el.style.transition;
        var prevHeight = el.style.height;
        el.style.transition = 'none';
        el.style.transform = 'translateY(0%)';
        el.style.height = 'auto';
        var h = el.offsetHeight || el.scrollHeight || el.getBoundingClientRect().height;
        el.style.height = prevHeight;
        el.style.transform = prevTransform;
        el.style.transition = prevTransition;
        return h;
      }

      // Applique une hauteur mesuree a divChange, mais ne l'ecrase JAMAIS avec 0 : une mesure a 0
      // signifie que la mise en page n'etait pas encore stable (ex: juste apres DOMContentLoaded,
      // avant que le CSS externe Webflow n'ait fini d'etre applique) - dans ce cas on garde la
      // hauteur precedente plutot que de clipper tout le texte avec overflow:hidden + height:0.
      function applyHeight(h) {
        if (h > 0) divChange.style.height = h + 'px';
      }

      function stopProgress() {
        if (progressRAF) cancelAnimationFrame(progressRAF);
        progressRAF = null;
      }
      function startProgress() {
        stopProgress();
        if (!ligne) return;
        ligne.style.transition = 'none';
        ligne.style.width = '0%';
        void ligne.offsetWidth;
        var start = performance.now();
        function tick(now) {
          var pct = Math.min(1, (now - start) / AUTOPLAY_MS);
          ligne.style.width = pct * 100 + '%';
          if (pct < 1) progressRAF = requestAnimationFrame(tick);
        }
        progressRAF = requestAnimationFrame(tick);
      }

      function goTo(index, direction) {
        // direction 1 (suivant/auto) : le mot courant sort par le bas, le nouveau entre par le haut.
        // direction -1 (precedent) : le mot courant sort par le haut, le nouveau entre par le bas.
        if (index === current || isAnimating) return;
        isAnimating = true;
        var outgoing = words[current];
        var incoming = words[index];
        var targetH = measure(incoming);

        incoming.style.transition = 'none';
        incoming.style.zIndex = '2';
        incoming.style.opacity = '0';
        incoming.style.transform = 'translateY(' + (direction > 0 ? '-100%' : '100%') + ')';
        void incoming.offsetWidth;
        incoming.style.transition = 'transform ' + DURATION + 'ms ease, opacity ' + DURATION + 'ms ease';

        outgoing.style.zIndex = '1';
        outgoing.style.opacity = '0';
        outgoing.style.transform = 'translateY(' + (direction > 0 ? '100%' : '-100%') + ')';

        incoming.style.opacity = '1';
        incoming.style.transform = 'translateY(0%)';

        divChange.style.transition = 'height ' + DURATION + 'ms ease';
        applyHeight(targetH);

        current = index;
        setImage(localKeyOf(incoming));
        setTimeout(function () {
          isAnimating = false;
        }, DURATION + 20);
      }

      function next(manual) {
        goTo((current + 1) % words.length, 1);
        if (manual) {
          restartAutoplay();
        } else {
          // Defilement automatique : le timer setInterval continue de tourner tel quel, mais la
          // barre de progression doit repartir de 0 pour ce nouveau cycle (sinon elle reste figee
          // a 100% des le deuxieme mot, faute d'avoir jamais ete relancee).
          startProgress();
        }
      }
      function prev(manual) {
        goTo((current - 1 + words.length) % words.length, -1);
        if (manual) restartAutoplay();
      }
      function startAutoplay() {
        stopAutoplay();
        timer = setInterval(function () {
          next(false);
        }, AUTOPLAY_MS);
        startProgress();
      }
      function stopAutoplay() {
        if (timer) {
          clearInterval(timer);
          timer = null;
        }
        stopProgress();
      }
      function restartAutoplay() {
        startAutoplay();
      }

      if (prevBtn)
        prevBtn.addEventListener('click', function () {
          prev(true);
        });
      if (nextBtn)
        nextBtn.addEventListener('click', function () {
          next(true);
        });

      // Init : seul le premier mot est visible, hauteur du conteneur fixee, image correspondante activee.
      words.forEach(function (w, i) {
        w.style.opacity = i === 0 ? '1' : '0';
        w.style.transform = 'translateY(0%)';
        w.style.zIndex = i === 0 ? '2' : '1';
      });
      divChange.style.position = 'relative';
      divChange.style.overflow = 'hidden';
      setImage(localKeyOf(words[0]));
      startAutoplay();

      // Comme tous les mots sont en position:absolute (hors flux), divChange n'a par lui-meme
      // aucune hauteur naturelle : il faut la mesurer sur words[0] et l'appliquer explicitement,
      // sinon overflow:hidden clippe tout le texte a une hauteur de 0. Juste apres
      // DOMContentLoaded, le CSS externe de Webflow peut ne pas encore etre totalement applique
      // et la mesure initiale renvoyer 0 - on reessaie sur quelques frames jusqu'a obtenir une
      // valeur reelle.
      var heightAttempts = 0;
      function establishInitialHeight() {
        var h = measure(words[0]);
        if (h > 0) {
          applyHeight(h);
        } else if (heightAttempts < 20) {
          heightAttempts++;
          requestAnimationFrame(establishInitialHeight);
        }
      }
      establishInitialHeight();
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initShowreelMobile);
    else initShowreelMobile();
  })();
</script>
